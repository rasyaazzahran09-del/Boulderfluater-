name: Build Android Native APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android Native"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          # FIX: tambah --fail --retry supaya download yang gagal tidak
          # menghasilkan file HTML error page yang diteruskan ke step berikutnya.
          curl -sSL --fail --retry 3 --retry-delay 2 --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            head -c 500 project.zip
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache (percepat build berikutnya)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache dependency + wrapper otomatis ON — build ke-2 dst jauh lebih
          # cepat karena tidak download ulang semua dependency Gradle.
          cache-read-only: false

      - name: Locate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Mencari gradlew (project Android Native) ==="
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)

          if [ -z "$GRADLE_PATH" ]; then
            echo "❌ gradlew tidak ditemukan. Project ini bukan project Android Native (Gradle) yang valid."
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          echo "✅ gradlew ditemukan di: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLE_PATH"

          # FIX: gradlew yang di-edit di Windows mengandung CRLF → bash error
          # "bad interpreter: /bin/bash^M". Normalisasi dulu supaya aman.
          sed -i 's/\r$//' "$GRADLE_PATH" 2>/dev/null || true
          [ -f "$GRADLE_DIR/gradle/wrapper/gradle-wrapper.properties" ] && \
            sed -i 's/\r$//' "$GRADLE_DIR/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null || true

          # FIX: tuning Gradle — build paralel + build cache → build jauh lebih cepat.
          if [ ! -f "$GRADLE_DIR/gradle.properties" ]; then
            touch "$GRADLE_DIR/gradle.properties"
          fi
          if ! grep -q "org.gradle.parallel" "$GRADLE_DIR/gradle.properties"; then
            printf '\norg.gradle.parallel=true\n' >> "$GRADLE_DIR/gradle.properties"
          fi
          if ! grep -q "org.gradle.caching" "$GRADLE_DIR/gradle.properties"; then
            printf 'org.gradle.caching=true\n' >> "$GRADLE_DIR/gradle.properties"
          fi

      # FIX: step "Lint Project (best-effort)" lama DIHAPUS — makan waktu 1-3
      # menit per build padahal hasilnya tidak pernah dipakai bot (log error
      # diambil otomatis dari step build yang gagal). Ini memotong total waktu
      # build Native secara signifikan.

      - name: Build APK (Native Gradle)
        working-directory: ${{ env.PROJECT_DIR }}/${{ env.GRADLE_DIR }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            # FIX: banyak project native gagal di assembleRelease hanya karena
            # signing config release tidak lengkap. Kalau release gagal,
            # OTOMATIS fallback ke assembleDebug supaya user tetap dapat APK
            # (bukan langsung build FAILED).
            if ! ./gradlew assembleRelease --stacktrace; then
              echo ""
              echo "⚠️⚠️⚠️ assembleRelease GAGAL (kemungkinan masalah signing config) ⚠️⚠️⚠️"
              echo "🔁 Melakukan fallback ke assembleDebug agar user tetap mendapat APK..."
              echo ""
              ./gradlew assembleDebug --stacktrace
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ Tidak ada file .apk yang dihasilkan!"
            exit 1
          fi
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK ditemukan: $APK_PATH"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
