name: Build Unity APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Unity"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASS }}
      ANDROID_KEYALIAS_NAME: ${{ secrets.UNITY_ANDROID_KEYALIAS_NAME }}
      ANDROID_KEYALIAS_PASS: ${{ secrets.UNITY_ANDROID_KEYALIAS_PASS }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          echo ""
          echo "=== File Type ==="
          file project.zip
          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Project Dir (cari ProjectSettings/ProjectVersion.txt) ==="
          PV_FILE=$(find project_raw -type f -path "*ProjectSettings/ProjectVersion.txt" | head -n 1)

          if [ -z "$PV_FILE" ]; then
            echo "❌ ProjectVersion.txt tidak ditemukan!"
            echo "ZIP ini bukan project Unity yang valid."
            echo "Struktur isi ZIP:"
            find project_raw -maxdepth 3 -type d | head -30
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PV_FILE")")
          echo "✅ Project Unity ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          # Bersihkan folder hasil editor yang tidak dibutuhkan CI (hemat ruang & waktu import)
          echo "=== Membersihkan folder Library/Temp/Logs/Obj/Builds lama (jika ada) ==="
          rm -rf "$PROJECT_DIR/Library" "$PROJECT_DIR/Temp" "$PROJECT_DIR/Logs" "$PROJECT_DIR/Obj" "$PROJECT_DIR/Builds" "$PROJECT_DIR/.gradle" || true

      - name: Detect Unity Version
        run: |
          UNITY_VERSION=$(grep -oP '(?<=m_EditorVersion: ).*' "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt" | tr -d '\r' | xargs)
          if [ -z "$UNITY_VERSION" ]; then
            echo "❌ Gagal membaca versi Unity dari ProjectVersion.txt"
            exit 1
          fi
          echo "✅ Versi Unity project: $UNITY_VERSION"
          echo "UNITY_VERSION=$UNITY_VERSION" >> $GITHUB_ENV

      - name: Preflight Unity License
        run: |
          echo "=== Cek Lisensi Unity ==="
          if [ -n "$UNITY_LICENSE" ]; then
            echo "✅ UNITY_LICENSE terdeteksi (lisensi personal/manual ULF)."
          elif [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -n "$UNITY_SERIAL" ]; then
            echo "✅ Lisensi Pro terdeteksi (UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL)."
          else
            echo "❌ LISENSI UNITY BELUM DIISI!"
            echo ""
            echo "Build Unity butuh sekret UNITY_LICENSE di repo GitHub worker."
            echo ""
            echo "=== CARA SET (ADMIN) ==="
            echo "1. Buka repo GitHub worker → Settings → Secrets and variables → Actions"
            echo "2. Klik 'New repository secret'"
            echo "3. Name   : UNITY_LICENSE"
            echo "4. Value  : isi isi file lisensi manual (.alf yang sudah diaktivasi jadi ULF)"
            echo "   Panduan: https://game.ci/docs/github/activation"
            echo ""
            echo "Lisensi Personal Unity GRATIS. Setelah secret diisi, build ulang dari bot."
            exit 1
          fi

      - name: Free Disk Space (Anti 'No space left on device')
        run: |
          echo "=== Sebelum pembersihan ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm/temurin-8-jdk-amd64 || true
          sudo docker image prune -af || true
          echo "=== Setelah pembersihan ==="
          df -h /

      - name: Inject GameCI Build Script
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_NAME="UnityGame"
          mkdir -p "$PROJECT_DIR/Assets/Editor"

          # Skrip build CI di-inject ke Assets/Editor (folder khusus editor —
          # otomatis terkompilasi ke Assembly-CSharp-Editor tanpa perlu asmdef).
          # Build type DIBAKIM ke dalam kode supaya tidak tergantung env docker.
          cat > "$PROJECT_DIR/Assets/Editor/GameCIBuild.cs" << EOF
          // Auto-generated by Web2Apk Pro Bot (Unity Build feature) - DO NOT EDIT
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class GameCIBuild
          {
              public static void PerformBuild()
              {
                  // 1. Kumpulkan scene: prioritas EditorBuildSettings, fallback semua scene di Assets
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s.enabled && !string.IsNullOrEmpty(s.path))
                      .Select(s => s.path)
                      .ToArray();

                  if (scenes == null || scenes.Length == 0)
                  {
                      Debug.Log("[GameCI] EditorBuildSettings kosong - fallback ke semua scene di Assets/");
                      scenes = AssetDatabase.FindAssets("t:Scene", new string[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(p => !string.IsNullOrEmpty(p))
                          .Distinct()
                          .ToArray();
                  }

                  if (scenes == null || scenes.Length == 0)
                  {
                      throw new Exception("[GameCI] Tidak ada scene untuk di-build. Pastikan project punya minimal 1 scene .unity");
                  }

                  Debug.Log("[GameCI] Scene yang di-build (" + scenes.Length + "): " + string.Join(", ", scenes));

                  // 2. Setting build sesuai mode yang dipilih di bot
                  string buildType = "$BUILD_TYPE";
                  if (buildType == "debug")
                  {
                      EditorUserBuildSettings.development = true;
                      EditorUserBuildSettings.connectProfiler = true;
                      Debug.Log("[GameCI] Mode: DEBUG (development build)");
                  }
                  else
                  {
                      EditorUserBuildSettings.development = false;
                      Debug.Log("[GameCI] Mode: RELEASE");
                  }

                  // APK (bukan .aab) supaya bisa langsung di-install
                  EditorUserBuildSettings.buildAppBundle = false;
                  EditorUserBuildSettings.androidBuildSystem = AndroidBuildSystem.Gradle;

                  // 3. Output: <project>/build/Android/UnityGame.apk
                  string output = "build/Android/$BUILD_NAME.apk";
                  Directory.CreateDirectory(Path.GetDirectoryName(output));

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);

                  if (report.summary.result != BuildResult.Succeeded)
                  {
                      throw new Exception("[GameCI] Build GAGAL: result=" + report.summary.result +
                          " errors=" + report.summary.totalErrors);
                  }

                  Debug.Log("[GameCI] Build SUKSES: " + report.summary.outputPath +
                      " ukuran=" + (report.summary.totalSize / (1024 * 1024)) + " MB");
              }
          }
          EOF

          echo "✅ GameCIBuild.cs ter-inject (mode: $BUILD_TYPE)"

          # Kalau admin isi keystore, decode ke file sekali di sini (opsional)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/unity_keystore.keystore" || true
            echo "✅ Keystore release ditemukan & di-decode."
          else
            echo "ℹ️ Keystore release tidak diisi — APK akan pakai debug-signature Unity (tetap bisa di-install)."
          fi

      - name: Build Unity APK (GameCI)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          projectPath: ${{ env.PROJECT_DIR }}
          buildName: UnityGame
          buildsPath: build
          buildMethod: GameCIBuild.PerformBuild
          allowDirtyBuild: true
          androidSymbolType: none
          androidKeystoreName: unity_keystore.keystore
          androidKeystoreBase64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.UNITY_ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.UNITY_ANDROID_KEYALIAS_PASS }}

      - name: Check APK Output
        run: |
          echo "=== Mencari hasil APK ==="
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan setelah build selesai!"
            find $GITHUB_WORKSPACE/build -type f 2>/dev/null | head -30 || true
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK ditemukan: $APK_PATH"
          ls -lh "$APK_FOUND"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-apk-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
