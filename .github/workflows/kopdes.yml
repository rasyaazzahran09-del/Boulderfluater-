name: Build KopDes Simulator APK

# ============================================================
# Workflow KHUSUS project KopDes Simulator (libGDX + Gradle).
# Dipicu bot via workflow_dispatch dengan input:
#   zip_url    : URL ZIP project (hasil uploadZipToRelease di github.js)
#   tag        : tag build unik per job
#   build_type : debug / release
#
# Struktur project yang didukung (sesuai kopdes-simulator v1.0.0):
#   settings.gradle  + gradlew  di root (modul: common, core, desktop, android, server)
#   APK dihasilkan modul  :android  -> android/build/outputs/apk/...
#   Release otomatis signed kunci debug bila keystore.properties tidak ada,
#   sehingga assembleRelease SELALU menghasilkan APK yang bisa dipasang.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project KopDes Simulator (libGDX/Gradle)"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          # --fail  : gagal bila HTTP error (4xx/5xx), tidak simpan body error sebagai zip
          # --retry : tahan gangguan jaringan sesaat
          curl -L --fail --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          # ZIP kosong/rusak -> gagal cepat dengan pesan jelas
          MIN_SIZE=1000
          ACTUAL_SIZE=$(stat -c%s project.zip)
          if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]; then
            echo "❌ ZIP terlalu kecil ($ACTUAL_SIZE byte) — download kemungkinan gagal."
            cat project.zip || true
            exit 1
          fi

          echo ""
          echo "=== File Type ==="
          file project.zip

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip || true
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Project Dir ==="
          # Kalau ZIP membungkus project dalam SATU folder, masuk ke folder itu.
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" | head -30

      - name: Validate KopDes Project
        run: |
          echo "=== Validasi project KopDes Simulator ==="

          # gradlew bisa di root ZIP atau di dalam sub-folder — cari otomatis.
          GRADLE_PATH=$(find "$PROJECT_DIR" -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$GRADLE_PATH" ]; then
            echo "❌ gradlew tidak ditemukan. ZIP bukan project KopDes Simulator (libGDX/Gradle) yang valid."
            echo "   Pastikan ZIP berisi settings.gradle + gradlew + modul android/."
            exit 1
          fi

          chmod +x "$GRADLE_PATH"
          GRADLE_DIR=$(cd "$(dirname "$GRADLE_PATH")" && pwd)   # ABSOLUTE path
          echo "✅ gradlew ditemukan di: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

          # Tandai modul android (kalau ada) supaya build menarget task yang tepat.
          if [ -f "$GRADLE_DIR/android/build.gradle" ]; then
            echo "✅ Modul android terdeteksi -> build :android:assemble*"
            echo "HAS_ANDROID_MODULE=true" >> $GITHUB_ENV
          else
            echo "⚠️ Modul android tidak ditemukan -> build assemble* di root (fallback)"
            echo "HAS_ANDROID_MODULE=false" >> $GITHUB_ENV
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          # Cache dependensi Gradle -> build kedua & berikutnya jauh lebih cepat
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Analyze Project (best-effort)
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          echo "[RESULT_ANALYZE]"
          ./gradlew help --stacktrace > analyze_report.txt 2>&1 || true
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"
          rm -f analyze_report.txt
        continue-on-error: true

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Build APK (KopDes Simulator Gradle)
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          # Target task yang TEPAT:
          #   - Modul android ada  -> :android:assembleDebug/Release
          #     (lebih cepat: desktop/server tidak ikut di-assemble)
          #   - Tidak ada          -> assembleDebug/Release di root (fallback umum)
          if [ "$HAS_ANDROID_MODULE" = "true" ]; then
            TASK_PREFIX=":android:"
          else
            TASK_PREFIX=""
          fi

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew ${TASK_PREFIX}assembleDebug --stacktrace -x lint
          else
            ./gradlew ${TASK_PREFIX}assembleRelease --stacktrace -x lint
          fi

      - name: Check APK Output
        run: |
          # Cari SEMUA APK hasil build (release bisa bernama android-release.apk
          # atau app-release.apk tergantung konfigurasi).
          mapfile -t APK_LIST < <(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/intermediates/*")

          if [ "${#APK_LIST[@]}" -eq 0 ]; then
            echo "❌ APK tidak ditemukan setelah build!"
            echo "=== Struktur folder build ==="
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name "apk" -o -maxdepth 4 -type d -name "outputs" | head
            exit 1
          fi

          echo "=== APK ditemukan (${#APK_LIST[@]}) ==="
          mkdir -p apks
          for apk in "${APK_LIST[@]}"; do
            ls -lh "$apk"
            # Salin semua APK ke satu folder supaya upload-artifact gampang
            cp "$apk" apks/
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopdes-apk-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: apks/*.apk
          retention-days: 1
          if-no-files-found: error
