name: Flutter Build Bot - ZIP to APK
run-name: "Build APK ${{ inputs.build_id || github.run_id }}"

"on":
  workflow_dispatch:
    inputs:
      zip_filename:
        description: Nama file ZIP yang akan di-build
        required: true
        default: project.zip
      build_id:
        description: ID unik build dari bot Telegram
        required: true
        default: manual-build
      flutter_version:
        description: Versi Flutter, isi auto / stable / 3.35.5 / 3.22.3
        required: false
        default: auto
permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  DEFAULT_FLUTTER_VERSION: 3.35.5

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tentukan ZIP Target
        id: zipfile
        shell: bash
        run: |
          set -e
          INPUT_ZIP="${{ github.event.inputs.zip_filename }}"
          BUILD_ID="${{ github.event.inputs.build_id }}"
          if [ -z "$INPUT_ZIP" ] || [ ! -f "$INPUT_ZIP" ]; then
            echo "ZIP target tidak ditemukan: $INPUT_ZIP"
            echo "Build ID: $BUILD_ID"
            echo "Pastikan file ZIP dari bot sudah ter-upload sebelum workflow dipicu."
            exit 1
          fi
          ZIP_NAME="$INPUT_ZIP"
          echo "ZIP dipakai: $ZIP_NAME"
          echo "Build ID: $BUILD_ID"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Extract dan Validasi ZIP Flutter
        shell: bash
        run: |
          set -e
          ZIP="${{ steps.zipfile.outputs.zip_name }}"
          WORK_DIR="$GITHUB_WORKSPACE/build_workspace"
          EXTRACT_DIR="$WORK_DIR/extracted"
          PROJECT_COPY="$WORK_DIR/project"

          rm -rf "$WORK_DIR"
          mkdir -p "$EXTRACT_DIR" "$PROJECT_COPY"
          unzip -q -o "$ZIP" -d "$EXTRACT_DIR"

          PUBSPEC="$(find "$EXTRACT_DIR" -type f -name "pubspec.yaml" | head -1)"
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP."
            echo "Pastikan ZIP berisi project Flutter, bukan hanya README atau file kosong."
            echo "Isi ZIP yang terbaca:"
            find "$EXTRACT_DIR" -maxdepth 2 -mindepth 1 -printf '%P\n' | head -80
            exit 1
          fi

          PROJECT_DIR_SRC="$(dirname "$PUBSPEC")"
          cp -a "$PROJECT_DIR_SRC/." "$PROJECT_COPY/"
          echo "PROJECT_DIR=$PROJECT_COPY" >> "$GITHUB_ENV"
          echo "Project Flutter ditemukan di: $PROJECT_DIR_SRC"

      - name: Deteksi Versi Flutter
        id: flutterver
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          INPUT_VERSION="${{ github.event.inputs.flutter_version }}"
          VERSION="${DEFAULT_FLUTTER_VERSION}"

          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "auto" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -f ".fvm/fvm_config.json" ]; then
            FVM_VERSION="$(python3 -c "import json; print(json.load(open('.fvm/fvm_config.json')).get('flutterSdkVersion',''))" 2>/dev/null || true)"
            [ -n "$FVM_VERSION" ] && VERSION="$FVM_VERSION"
          elif grep -Eq "sdk:[[:space:]]*['\"]>=2\." pubspec.yaml 2>/dev/null; then
            VERSION="3.22.3"
          elif grep -Eq "sdk:[[:space:]]*['\"]>=3\." pubspec.yaml 2>/dev/null; then
            VERSION="${DEFAULT_FLUTTER_VERSION}"
          fi

          echo "flutter_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "FLUTTER_VERSION_RESOLVED=$VERSION" >> "$GITHUB_ENV"
          echo "Versi Flutter dipakai: $VERSION"

      - name: Setup Flutter SDK Fleksibel
        uses: subosito/flutter-action@v2
        with:
          channel: "${{ env.FLUTTER_CHANNEL }}"
          flutter-version: "${{ steps.flutterver.outputs.flutter_version }}"
          cache: true

      - name: Cache Flutter Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: "${{ runner.os }}-pub-${{ steps.flutterver.outputs.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}"
          restore-keys: |
            ${{ runner.os }}-pub-${{ steps.flutterver.outputs.flutter_version }}-
            ${{ runner.os }}-pub-

      - name: Auto Fix Error dan Patch Build Files
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter --version
          flutter config --no-analytics
          rm -rf .dart_tool build .flutter-plugins .flutter-plugins-dependencies

          find lib -type f -name "*.dart" -print0 2>/dev/null | xargs -0 -r sed -i \
            -e 's/TextOverflowellipsis/TextOverflow.ellipsis/g' \
            -e 's/MainAxisAlignmentcenter/MainAxisAlignment.center/g' \
            -e 's/CrossAxisAlignmentcenter/CrossAxisAlignment.center/g' \
            -e 's/FontWeightbold/FontWeight.bold/g'

          patch_gradle_file() {
            local f="$1"
            [ -f "$f" ] || return 0
            echo "Patching $f"
            sed -i -E 's/(compileSdk(Version)?[[:space:]]*=?[[:space:]]*)(flutter\.compileSdkVersion|[0-9]+)/\136/g' "$f"
            sed -i -E 's/(targetSdk(Version)?[[:space:]]*=?[[:space:]]*)(flutter\.targetSdkVersion|[0-9]+)/\136/g' "$f"
            sed -i -E 's/(minSdk(Version)?[[:space:]]*=?[[:space:]]*)(flutter\.minSdkVersion|[0-9]+)/\123/g' "$f"
            sed -i -E 's/(ndkVersion[[:space:]]*=?[[:space:]]*")[^"]+(".*)/\128.2.13676358\2/g' "$f" || true
          }
          patch_gradle_file "android/app/build.gradle.kts"
          patch_gradle_file "android/app/build.gradle"

          if [ -f android/gradle.properties ]; then
            grep -q '^android.useAndroidX=true' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
            grep -q '^android.enableJetifier=true' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f pubspec.lock ]; then
            echo "Mencoba flutter pub get dengan pubspec.lock..."
            if ! flutter pub get; then
              echo "flutter pub get gagal. Menghapus pubspec.lock lalu mencoba ulang..."
              rm -f pubspec.lock
              flutter pub get
            fi
          else
            flutter pub get
          fi

      - name: Setup Android SDK Licenses
        shell: bash
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager "platform-tools" \
                     "platforms;android-33" "build-tools;33.0.2" \
                     "platforms;android-34" "build-tools;34.0.0" \
                     "platforms;android-35" "build-tools;35.0.0" \
                     "platforms;android-36" "build-tools;36.0.0" \
                     "ndk;28.2.13676358" >/dev/null 2>&1
          exit 0

      - name: Build APK Release
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          set -e
          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"
          BUILD_ID="${{ steps.zipfile.outputs.build_id }}"
          APK_NAME="flutter-release-${BUILD_ID}.apk"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/$APK_NAME"
          APK_SIZE="$(du -sh "$APK_DIR/$APK_NAME" | cut -f1)"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_DIR/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate Release Tag
        id: tag
        shell: bash
        run: |
          TAG="build-${{ steps.zipfile.outputs.build_id }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.tag.outputs.tag }}"
          name: "Build ${{ steps.tag.outputs.tag }}"
          body: |
            Build otomatis dari Telegram Bot
            ZIP: ${{ steps.zipfile.outputs.zip_name }}
            APK: ${{ steps.apk.outputs.apk_name }}
            Size: ${{ steps.apk.outputs.apk_size }}
            Flutter: ${{ steps.flutterver.outputs.flutter_version }}
            SHA: ${{ github.sha }}
          files: "${{ steps.apk.outputs.apk_path }}"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "APK-${{ steps.zipfile.outputs.build_id }}"
          path: "${{ steps.apk.outputs.apk_path }}"
          retention-days: 14
