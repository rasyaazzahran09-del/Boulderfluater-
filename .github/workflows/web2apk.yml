name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'Icon Url'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # TIDAK pin versi spesifik lagi — pakai stable terbaru supaya setup
          # tidak pernah 404 ("version not exist") dan template `flutter create`
          # selalu 100% cocok dengan SDK yang dipakai build.
          channel: stable
          cache: true

      - name: Cache Gradle & Pub (percepat build berikutnya 3-5 menit)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache/hosted
          key: web2apk-${{ runner.os }}-v2
          restore-keys: web2apk-${{ runner.os }}-

      - name: Create Flutter Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          # FIX: nama package Dart/Gradle tidak boleh KOSONG dan tidak boleh
          # diawali angka — kalau tidak, `flutter create` langsung error.
          case "$PKG" in
            ''|[0-9]*) PKG="app$PKG" ;;
          esac
          echo "Project package: $PKG"
          # FIX: --platforms android → tidak generate ios/web/macos/windows/linux
          # yang tidak dipakai (create jauh lebih cepat).
          flutter create --platforms android --org com.webapk --project-name "$PKG" myapp

      - name: Add Dependencies
        run: |
          cd myapp
          # FIX: semua dependency dalam SATU perintah pub add (1x resolve saja,
          # bukan 3x) → proses jadi lebih cepat dan tidak dobel-download.
          flutter pub add webview_flutter connectivity_plus
          flutter pub add dev:flutter_launcher_icons

      - name: Write main.dart
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"

          # ================================================================
          # FIX PENTING (penyebab build gagal sebelumnya):
          # Dulu APP_NAME & WEB_URL di-inject lewat `sed` langsung ke dalam
          # main.dart. Kalau nama aplikasi mengandung karakter spesial
          # (tanda kutip ', #, &, /, dll) maka hasil Dart-nya SYNTAX ERROR
          # dan sed-nya pun bisa rusak. Sekarang nilainya DI-ENCODE BASE64
          # (karakter base64 100% aman untuk Dart), lalu di-decode runtime.
          # Jadi NAMA APLIKASI DENGAN KARAKTER APAPUN TIDAK AKAN PERNAH
          # bikin build error lagi.
          # ================================================================
          NAME_B64=$(printf '%s' "$APP_NAME" | base64 -w0)
          URL_B64=$(printf '%s' "$WEB_URL" | base64 -w0)

          cat > myapp/lib/app_config.dart << EOF
          import 'dart:convert' show base64, utf8;

          const String _kNameB64 = '$NAME_B64';
          const String _kUrlB64 = '$URL_B64';

          final String kAppName = utf8.decode(base64.decode(_kNameB64));
          final String kWebUrl = utf8.decode(base64.decode(_kUrlB64));
          EOF

          cat > myapp/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:async';

          import 'app_config.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: kAppName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, primarySwatch: Colors.blue),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            late AnimationController _dotController;
            late Animation<double> _fadeAnim;
            late Animation<double> _scaleAnim;
            late Animation<double> _dot1Anim;
            late Animation<double> _dot2Anim;
            late Animation<double> _dot3Anim;
            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();
              _fadeController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _scaleController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _dotController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1200))..repeat();

              _fadeAnim = Tween<double>(begin: 0.0, end: 1.0).animate(CurvedAnimation(parent: _fadeController, curve: Curves.easeOut));
              _scaleAnim = Tween<double>(begin: 0.75, end: 1.0).animate(CurvedAnimation(parent: _scaleController, curve: Curves.easeOutBack));

              _dot1Anim = TweenSequence([
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _dot2Anim = TweenSequence([
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _dot3Anim = TweenSequence([
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _fadeController.forward();
              _scaleController.forward();
              Timer(const Duration(milliseconds: 1500), () => _checkConnectionAndNavigate());
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking) return;
              setState(() => _isChecking = true);
              await Future.delayed(const Duration(milliseconds: 1000));
              var connectivityResult = await (Connectivity().checkConnectivity());
              if (connectivityResult.every((r) => r == ConnectivityResult.none)) {
                setState(() => _isChecking = false);
                _showNoConnectionDialog();
              } else {
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const WebViewPage()));
                }
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() => _dialogShown = true);
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  title: const Text('Gagal Terhubung'),
                  content: const Text('Tidak ada koneksi internet.'),
                  actions: [
                    TextButton(onPressed: () { Navigator.pop(context); setState(() => _dialogShown = false); _checkConnectionAndNavigate(); }, child: const Text('Coba Lagi'))
                  ],
                ),
              );
            }

            @override
            void dispose() { _fadeController.dispose(); _scaleController.dispose(); _dotController.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              return Scaffold(body: Center(child: Text(kAppName, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold))));
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (url) {},
                  ),
                )
                ..loadRequest(Uri.parse(kWebUrl));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: _controller)));
            }
          }
          DART

          # Sanity check: tampilkan hasil config (base64) untuk debugging
          echo "=== app_config.dart ==="
          cat myapp/lib/app_config.dart

      - name: Fix Android Permissions & Localhost Support
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"

          # Permission internet (dibutuhkan release build)
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' $MANIFEST

          # ================================================================
          # FIX: SUPPORT http://localhost:500 / 127.0.0.1 / IP LAN / PORT BEBAS
          # Android memblokir trafik cleartext (http) secara default sejak
          # API 28 — WebView akan blank/error kalau URL website-nya http.
          # usesCleartextTraffic=true + network_security_config mengizinkan:
          #   - http://localhost:500, http://127.0.0.1:PORT, IP LAN
          #   - https dengan sertifikat self-signed yang di-install user
          # ================================================================
          sed -i 's/<application\b/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' $MANIFEST

          mkdir -p myapp/android/app/src/main/res/xml
          cat > myapp/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # FIX: label nama app di manifest sekarang di-escape dengan benar
          # (XML escape dulu, lalu escape karakter spesial sed) — nama app
          # dengan &, <, >, " tidak akan merusak manifest lagi.
          XML_NAME=$(printf '%s' "$APP_NAME" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g')
          XML_NAME_SED=$(printf '%s' "$XML_NAME" | sed -e 's/[&/\\]/\\&/g')
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$XML_NAME_SED\"/" $MANIFEST

          echo "=== AndroidManifest.xml ==="
          cat $MANIFEST

      - name: Download Icon
        run: |
          mkdir -p myapp/assets/icon
          # FIX: imagemagick USUALLY sudah ada di runner — hanya install kalau
          # memang tidak ada (hemat 20-60 detik per build).
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          fi

          # FIX: curl pakai --fail --retry + timeout supaya tidak menggantung,
          # dan error download TIDAK langsung mematikan build (ada fallback).
          curl -sSL --fail --retry 3 --retry-delay 2 --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.icon_url }}" \
            -o myapp/assets/icon/icon_raw || echo "⚠️ Download icon gagal (pakai fallback)"

          # FIX: kalau icon gagal download / format tidak didukung / corrupt,
          # OTOMATIS generate icon default — build TIDAK PERNAH gagal karena icon.
          if [ -s myapp/assets/icon/icon_raw ] && \
             convert myapp/assets/icon/icon_raw -resize 1024x1024^ -gravity center -extent 1024x1024 myapp/assets/icon/icon.png 2>/dev/null; then
            echo "✅ Icon user dipakai"
          else
            echo "⚠️ Icon tidak valid — generate icon default gradient"
            convert -size 1024x1024 gradient:'#2563EB'-'#7C3AED' myapp/assets/icon/icon.png 2>/dev/null || \
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > myapp/assets/icon/icon.png
          fi
          rm -f myapp/assets/icon/icon_raw
          ls -la myapp/assets/icon/

      - name: Generate Icons
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF
          cd myapp && dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build APK
        run: cd myapp && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          if-no-files-found: error
